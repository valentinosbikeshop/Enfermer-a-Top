<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Test</title>
</head>
<body>
    <h1>Video Test</h1>
    <div id="video-container"></div>
    <div id="log"></div>

    <script>
        const logDiv = document.getElementById('log');
        function log(msg) {
            console.log(msg);
            logDiv.innerHTML += `<p>${msg}</p>`;
        }

        const driveId = "1t_1tLF9OUsszRaqeOwavr-Pk4qYESwJv";
        
        async function fetchVideo() {
            try {
                log('Fetching video...');
                const url = `https://drive.usercontent.google.com/download?id=${driveId}&export=view`;
                const res = await fetch(url);
                log('Fetch complete. OK: ' + res.ok);
                
                if (!res.ok) {
                    throw new Error('HTTP ' + res.status);
                }
                
                const blob = await res.blob();
                log('Blob type: ' + blob.type);
                
                if (blob.type.includes('text/html')) {
                    throw new Error('Received HTML instead of video');
                }
                
                const blobUrl = URL.createObjectURL(blob);
                log('Blob URL created: ' + blobUrl);
                
                const video = document.createElement('video');
                video.src = blobUrl;
                video.autoplay = true;
                video.loop = true;
                video.muted = true;
                video.playsInline = true;
                video.style.width = '100%';
                video.style.maxWidth = '500px';
                
                document.getElementById('video-container').appendChild(video);
            } catch (e) {
                log('Error: ' + e.message);
            }
        }
        
        fetchVideo();
    </script>
</body>
</html>
